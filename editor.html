<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容编辑台 · 泠川</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div class="topbar">
    <h1>泠川 · 内容编辑台</h1>
    <span class="badge">本地使用 · 不会上传任何东西</span>
    <span class="grow"></span>
    <span class="status" id="status"></span>
    <button class="btn ghost" id="export">导出 albums.js</button>
    <button class="btn primary" id="save">保存到项目</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>相册</h2>
      <button class="btn" id="add-album" style="margin-bottom:1rem;width:100%">+ 新增相册</button>
      <div class="album-list" id="album-list"></div>
    </aside>
    <main class="main" id="editor"></main>
  </div>

  <script src="data/albums.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
